name: Build & Deploy Web

# 在 GitHub Actions 上构建 Godot Web 并发布到 GitHub Pages。
# 构建放在 CI 而不是提交产物：Actions 访问 GitHub Release 走机房内网，
# 比本地经代理上传 38MB wasm 稳定得多，也不会让仓库背上二进制历史。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"
          curl -sSL --retry 5 --retry-delay 3 -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          curl -sSL --retry 5 --retry-delay 3 -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          echo "--- templates ---"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | grep -i web

      - name: Import project
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --path . --import || true
          test -d .godot

      - name: Export Web
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p build/web
          "$GODOT" --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          python3 tools/patch_web.py build/web
          du -sh build/web
          ls -la build/web

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
